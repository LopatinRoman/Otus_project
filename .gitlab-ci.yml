stages:
  - lint
  - test
  - validate
  - publish
  - report

lint:
  stage: lint
  image: alpine:3.20
  script:
    - echo "lint placeholder OK"
  rules:
    - when: always

autotests:
  stage: test
  image: alpine:3.20
  script:
    - echo "autotests placeholder OK"
    - mkdir -p reports/junit
    - |
      cat > reports/junit/junit.xml <<'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <testsuite name="placeholder" tests="1" failures="0" errors="0" time="0.01">
        <testcase classname="placeholder" name="autotests" time="0.01"/>
      </testsuite>
      EOF
  artifacts:
    when: always
    expire_in: "7 days"
    paths:
      - reports/
    reports:
      junit: reports/junit/junit.xml
  rules:
    - when: always

validate_repo_structure:
  stage: validate
  image: alpine:3.20
  script:
    - set -eu
    # Папки
    - test -d doc/bpmn
    - test -d doc/c4
    - test -d doc/er
    - test -d doc/ui
    - test -f doc/integration/rmq.md
    - test -f doc/integration/examples/command_access_create.json
    - test -f doc/integration/examples/reply_access_created.json
    - test -f doc/integration/examples/command_asset_issue.json
    - test -f doc/integration/examples/reply_asset_issued.json
    - test -d doc/architecture
    - test -d tests
    - 'test -d presentation || (echo "ERROR: missing presentation/ (add it)" && exit 1)'
    - test -f README.md
    - 'test -f doc/architecture/decisions.md || (echo "ERROR: missing doc/architecture/decisions.md" && exit 1)'
    - 'echo "OK: repo structure looks good"'
  rules:
    - when: always

publish_artifacts:
  stage: publish
  image: alpine:3.20
  needs: ["validate_repo_structure"]
  script:
    - echo "Publishing docs/tests/presentation as artifacts"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - doc/
      - tests/
      - presentation/
  rules:
    - when: always

publish_reports:
  stage: report
  image: alpine:3.20
  needs:
    - job: autotests
      artifacts: true
  script:
    - echo "publish_reports placeholder OK"
    - ls -la reports || true
  artifacts:
    when: always
    expire_in: "7 days"
    paths:
      - reports/
  rules:
    - when: always
notify_youtrack:
  stage: report
  image: alpine:3.20
  needs:
    - job: autotests
      artifacts: true
  rules:
    - when: on_success
  script:
    - |
      set -eu

      apk add --no-cache curl ca-certificates
      cp "$LAB_ROOT_CA" /usr/local/share/ca-certificates/lab-mkcert-rootca.crt
      update-ca-certificates

      : "${YOUTRACK_BASE_URL:?Missing YOUTRACK_BASE_URL}"
      : "${YOUTRACK_TOKEN:?Missing YOUTRACK_TOKEN}"

      # Ищем issue key (DEV-4 / ALM-123) в доступных полях
      ISSUE_KEY="$(
        printf '%s\n%s\n%s\n%s\n' \
          "${CI_MERGE_REQUEST_TITLE:-}" \
          "${CI_COMMIT_TITLE:-}" \
          "${CI_COMMIT_REF_NAME:-}" \
          "${CI_COMMIT_MESSAGE:-}" \
        | grep -oE '[A-Z][A-Z0-9_]+-[0-9]+' | head -n1 || true
      )"

      if [ -z "$ISSUE_KEY" ]; then
        echo "No issue key found (expected like DEV-4). Skip."
        exit 0
      fi

      PIPELINE_URL="${CI_PIPELINE_URL}"
      JOB_URL="${CI_JOB_URL}"
      TEST_REPORT_URL="${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID}/test_report"
      COMMIT_URL="${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}"

      MR_URL=""
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        MR_URL="${CI_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}"
      fi

      COMMENT="CI passed. Pipeline: ${PIPELINE_URL} | Test report: ${TEST_REPORT_URL} | Job: ${JOB_URL} | Commit: ${COMMIT_URL}"
      if [ -n "$MR_URL" ]; then
        COMMENT="${COMMENT} | MR: ${MR_URL}"
      fi

      COMMENT_ESCAPED="$(printf '%s' "$COMMENT" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\r//g')"

      YT_URL="${YOUTRACK_BASE_URL%/}/api/issues/${ISSUE_KEY}/comments?fields=id"

      curl -fsS -X POST \
        "${YT_URL}" \
        -H "Authorization: Bearer ${YOUTRACK_TOKEN}" \
        -H "Accept: application/json" \
        -H "Content-Type: application/json" \
        --data "{\"text\":\"${COMMENT_ESCAPED}\"}"

      echo "Comment posted to YouTrack issue: ${ISSUE_KEY}"